spring.application.name=scheduling-service
server.port=${PORT:8083}
server.address=0.0.0.0

# Configuración de Base de Datos MySQL (Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:db_scheduling_service}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
    
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuracion de recordatorios
internal.service.token=${INTERNAL_SERVICE_TOKEN:}
user.service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8081}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
notifications.service.url=${NOTIFICATIONS_SERVICE_URL:http://localhost:8085}
reminders.poll-ms=60000
reminders.window-hours=8
reminders.timezone=America/Santiago

