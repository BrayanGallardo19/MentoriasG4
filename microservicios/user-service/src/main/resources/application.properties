spring.application.name=user-service

# Puerto del servidor
server.port=${PORT:8081}
server.address=0.0.0.0

# Configuración de la Base de Datos MySQL (Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:db_user_service}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Propiedades para JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Token para comunicación interna entre microservicios
internal.service.token=${INTERNAL_SERVICE_TOKEN:}

# Configuracion SMTP (usa variables de entorno por seguridad)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:certimentor@gmail.com}
spring.mail.password=${SMTP_PASSWORD:}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
