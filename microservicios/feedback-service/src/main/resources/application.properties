spring.application.name=feedback-service
server.port=${PORT:8084}
server.address=0.0.0.0

# Configuración de Base de Datos MySQL (Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:db_feedback_service}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Token para comunicación interna entre microservicios
internal.service.token=${INTERNAL_SERVICE_TOKEN:}
user.service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8081}
