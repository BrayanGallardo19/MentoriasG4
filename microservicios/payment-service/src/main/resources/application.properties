spring.application.name=payment-service
server.port=${PORT:8086}
server.address=0.0.0.0

# Credenciales Mercado Pago
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN:}

# Configuración de Base de Datos MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:db_payment_service}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
